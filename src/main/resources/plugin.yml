name: SimpleRanks
main: com.tommustbe12.simpleranks.SimpleRanks
author: TomMustBe12
website: https://tommustbe12.com
version: 3.2
api-version: 1.20
softdepend: [PlaceholderAPI]
commands:
  rank:
    description: Manage player ranks
    usage: /rank <create|delete|give|importanttext|setdefault|bracketcolor|priority|brackets> [args]
    permission: simpleranks.use
    aliases: [r]
permissions:
  simpleranks.use:
    description: Allows use of rank commands
    default: op
